apiVersion: v1
kind: Secret
metadata:
  name: web-template-go-secret
  labels:
    app.kubernetes.io/name: web-template-go
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # Enable the matching APP_DATA_*_ENABLED key in configmap.yaml before using
  # these connection strings.
  APP_DATA_POSTGRES_SOURCE: "postgres://user:password@postgres:5432/app?sslmode=disable"
  APP_DATA_REDIS_PASSWORD: ""
  APP_DATA_MONGODB_URI: "mongodb://mongo:27017"
  APP_DATA_REMOTE_GRPC_GREETER_TARGET: "greeter.default.svc.cluster.local:9000"
  APP_TRACING_ENDPOINT: "otel-collector.default.svc.cluster.local:4317"
