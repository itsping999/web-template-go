name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Debug
        run: |
          go version
          ls -la cmd/server/
          echo "--- build ---"
          go build -v ./cmd/server/ 2>&1 || true
          echo "--- vet ---"
          go vet -v ./cmd/server/ 2>&1 || true
          echo "--- vet all ---"
          go vet -v ./... 2>&1 || true

      - name: Verify
        run: make verify

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        run: make docker-build
