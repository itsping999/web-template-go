apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-template-go
  labels:
    app.kubernetes.io/name: web-template-go
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web-template-go
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-template-go
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: web-template-go:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            - name: grpc
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: web-template-go-config
            - secretRef:
                name: web-template-go-secret
                optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
