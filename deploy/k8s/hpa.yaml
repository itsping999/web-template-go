apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-template-go
  labels:
    app.kubernetes.io/name: web-template-go
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-template-go
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
